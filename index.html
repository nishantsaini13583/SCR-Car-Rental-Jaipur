<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR Car Rental | Jaipur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--pri:#0f2a4a;--acc:#1d4ed8;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--okb:#e6f6ef;--warnb:#fdf3e1;--badb:#fdeaea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b949e;--bd:#2b323c;--pri:#1f3a5f;--acc:#6ea0ff;--ok:#4cd2a0;--warn:#f2b45a;--bad:#ff8080;--okb:#10332a;--warnb:#382a0f;--badb:#3b1818;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{background:var(--pri);color:#fff;padding:18px 16px 0}
.in{max-width:1000px;margin:auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0}
.brand .d{font-size:12px;opacity:.8;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav button{padding:10px 18px;border:0;background:transparent;color:rgba(255,255,255,.7);font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#fff}
main{max-width:1000px;margin:auto;padding:18px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.stat span{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat b{display:block;font-size:26px;margin-top:4px}
.card{margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:5px;font-weight:600}
input,select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--badb);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
h2{font-size:13px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:26px;border:1px dashed var(--bd);border-radius:10px}
.money{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);display:flex;gap:22px;flex-wrap:wrap}
.money span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#login h1{font-size:20px;margin:0 0 4px}
#login form{grid-template-columns:1fr}
#err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="login" style="display:none">
  <div class="card">
    <h1>🚗 SCR Car Rental | Jaipur</h1><div class="mut">Sign in to continue</div>
    <form id="lf">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <div id="err"></div>
      <button class="btn">Sign in</button>
    </form>
  </div>
</div>
<div id="app" style="display:none">
  <div class="top"><div class="in">
    <div class="brand"><h1>🚗 SCR Car Rental | Jaipur</h1><div class="d"><span id="who"></span><button id="out">Sign out</button></div></div>
    <nav id="nav"></nav>
  </div></div>
  <main id="main"></main>
</div>
<script>
// ---------- CONFIG ----------
const SUPABASE_URL='https://gufjtgrkyubdgfcxwpky.supabase.co';
const SUPABASE_KEY='sb_publishable_u6O4oPo4Io5j9LHj7VBhmg_4BBhqS5c';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const S={cars:[],bookings:[],team:[],role:null,email:'',tab:'dash',q:''};
const adm=()=>S.role==='owner'||S.role==='admin';
const rs=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const td=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const car=id=>S.cars.find(c=>c.id===id);
const busy=id=>S.bookings.find(b=>b.car_id===id&&b.status==='active'&&b.start_date<=td()&&b.end_date>=td());
const $=id=>document.getElementById(id);

function fail(e){
  const m=e.code==='23P01'?'This vehicle is already booked for those dates.':e.code==='42501'?"You don't have permission for this action.":e.code==='23503'?'This record is linked to other data and cannot be deleted.':e.message;
  alert(m);
}
async function run(p){const r=await p;if(r.error){fail(r.error);return false}await load();return true}

async function load(){
  const [c,b]=await Promise.all([sb.from('cars').select('*').order('name'),sb.from('bookings').select('*').order('start_date',{ascending:false})]);
  S.cars=c.data||[];S.bookings=b.data||[];
  if(S.role==='owner'){const t=await sb.from('profiles').select('*').order('created_at');S.team=t.data||[]}
  render();
}
async function boot(session){
  $('login').style.display='none';
  const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(!p){await sb.auth.signOut();showLogin(pe?'Database error: '+pe.message+(pe.code?' ('+pe.code+')':''):'No profile row found for '+session.user.email+' (id '+session.user.id+'). Run the profile SQL again.');return}
  S.role=p.role;S.email=session.user.email;
  $('app').style.display='block';
  $('who').textContent=S.email+' · '+S.role;
  await load();
  sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe();
}
function showLogin(msg){$('app').style.display='none';$('login').style.display='block';$('err').textContent=msg||''}
$('lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('err').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  if(error)$('err').textContent=error.message;else boot(data.session)};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};

const TABS=[['dash','Dashboard',1],['bookings','Bookings',0],['cars','Fleet',1],['team','Team',2]];
function render(){
  const tabs=TABS.filter(t=>t[2]===0||(t[2]===1&&adm())||(t[2]===2&&S.role==='owner'));
  if(!tabs.find(t=>t[0]===S.tab))S.tab='bookings';
  $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  const m=$('main');
  m.innerHTML=S.tab==='dash'?dash():S.tab==='cars'?cars():S.tab==='team'?team():bookings();
  wire(m);
}
function dash(){
  const act=S.bookings.filter(b=>b.status==='active');
  const avail=S.cars.filter(c=>!c.service&&!busy(c.id)).length;
  const coll=S.bookings.reduce((s,b)=>s+ +b.paid,0);
  const pend=S.bookings.reduce((s,b)=>s+Math.max(0,+b.balance),0);
  const late=act.filter(b=>b.end_date<td());
  const soon=act.filter(b=>b.end_date>=td()).sort((a,b)=>a.end_date.localeCompare(b.end_date)).slice(0,5);
  const li=(b,cls)=>`<div class="card row"><div><b>${esc(b.customer_name)}</b> · ${esc(car(b.car_id)?.name||'—')}<div class="mut">Due back ${fd(b.end_date)} · ${esc(b.phone)}</div></div><span class="tag ${cls}">${cls==='bad'?'Overdue':'Active'}</span></div>`;
  return `<div class="grid">
  <div class="stat"><span>Total vehicles</span><b>${S.cars.length}</b></div>
  <div class="stat"><span>On rent</span><b>${act.length}</b></div>
  <div class="stat"><span>Available</span><b>${avail}</b></div>
  <div class="stat"><span>Revenue collected</span><b>${rs(coll)}</b></div>
  <div class="stat"><span>Outstanding</span><b style="color:var(--warn)">${rs(pend)}</b></div></div>
  <h2>Overdue returns (${late.length})</h2>${late.map(b=>li(b,'bad')).join('')||'<div class="empty">No overdue returns.</div>'}
  <h2>Upcoming returns</h2>${soon.map(b=>li(b,'ok')).join('')||'<div class="empty">No active bookings.</div>'}`;
}
function cars(){
  return `<div class="card"><b>Add vehicle</b><form id="fc">
  <label>Vehicle name<input name="name" placeholder="e.g. Maruti Dzire" required></label>
  <label>Registration number<input name="plate" placeholder="e.g. RJ14 AB 1234" required></label>
  <label>Daily rate (₹)<input name="rate" type="number" min="0" required></label>
  <label>&nbsp;<button class="btn">Add vehicle</button></label></form></div>
  <h2>Fleet (${S.cars.length})</h2>`+
  (S.cars.map(c=>{const b=busy(c.id);const t=c.service?['warn','In service']:b?['bad','On rent']:['ok','Available'];
  return `<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="mut">${esc(c.plate)} · ${rs(c.rate)}/day${b?' · Rented to '+esc(b.customer_name)+' until '+fd(b.end_date):''}</div></div><span class="tag ${t[0]}">${t[1]}</span></div>
  <div class="acts"><button class="btn s sm" data-svc="${c.id}">${c.service?'Mark as available':'Send for service'}</button><button class="btn d sm" data-dc="${c.id}">Delete</button></div></div>`}).join('')||'<div class="empty">No vehicles yet. Add your first vehicle above.</div>');
}
function bookings(){
  const free=S.cars.filter(c=>!c.service);
  const q=S.q.toLowerCase();
  const list=S.bookings.filter(b=>!q||(b.customer_name+b.phone+(car(b.car_id)?.name||'')).toLowerCase().includes(q)).sort((a,b)=>a.status===b.status?b.start_date.localeCompare(a.start_date):a.status==='active'?-1:1);
  return `<div class="card"><b>New booking</b>${free.length?`<form id="fb">
  <label>Customer name<input name="name" required></label>
  <label>Phone number<input name="phone" type="tel" required></label>
  <label>Vehicle<select name="carId" id="cs">${free.map(c=>`<option value="${c.id}" data-r="${c.rate}">${esc(c.name)} (${esc(c.plate)})${busy(c.id)?' – on rent':''}</option>`).join('')}</select></label>
  <label>Pickup date<input name="start" type="date" value="${td()}" required></label>
  <label>Return date<input name="end" type="date" value="${td()}" required></label>
  <label>Daily rate (₹)<input name="rate" type="number" id="rt" value="${free[0].rate}" required ${adm()?'':'readonly'}></label>
  <label>Advance paid (₹)<input name="paid" type="number" min="0" value="0"></label>
  <label>ID / licence number<input name="idno"></label>
  <label>&nbsp;<button class="btn">Create booking</button></label></form>`:'<div class="mut" style="margin-top:8px">No vehicles available. An admin needs to add vehicles first.</div>'}</div>
  <div class="row" style="align-items:center"><h2>All bookings (${list.length})</h2><input id="sq" placeholder="Search name, phone or vehicle" value="${esc(S.q)}" style="max-width:260px"></div>`+
  (list.map(b=>{const bl=+b.balance,late=b.status==='active'&&b.end_date<td();
  return `<div class="card"><div class="row"><div><b>${esc(b.customer_name)}</b> · ${esc(car(b.car_id)?.name||'—')}
  <div class="mut">${fd(b.start_date)} → ${fd(b.end_date)} · ${b.days} day(s) × ${rs(b.rate)} · ${esc(b.phone)}${b.id_no?' · ID '+esc(b.id_no):''}</div></div>
  <span class="tag ${b.status==='returned'?'ok':late?'bad':'warn'}">${b.status==='returned'?'Returned':late?'Overdue':'Active'}</span></div>
  <div class="money"><div><span>Total</span><b>${rs(b.total)}</b></div><div><span>Paid</span><b>${rs(b.paid)}</b></div><div><span>Balance</span><b style="color:${bl>0?'var(--bad)':'var(--ok)'}">${rs(bl)}</b></div></div>
  ${adm()?`<div class="acts">${bl>0?`<button class="btn s sm" data-pay="${b.id}">Record payment</button>`:''}${b.status==='active'?`<button class="btn sm" data-ret="${b.id}">Mark as returned</button>`:''}<button class="btn d sm" data-db="${b.id}">Delete</button></div>`:''}</div>`}).join('')||'<div class="empty">No bookings found.</div>');
}
function team(){
  return `<h2>Team access (${S.team.length})</h2><div class="mut" style="margin-bottom:10px">Add new people in Supabase → Authentication → Users, then set their role here.</div>`+
  S.team.map(p=>`<div class="card row" style="align-items:center"><div><b>${esc(p.full_name||p.email)}</b><div class="mut">${esc(p.email)}</div></div>
  <select data-role="${p.id}" style="max-width:150px">${['owner','admin','staff'].map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select></div>`).join('');
}
function wire(m){
  const fc=m.querySelector('#fc');
  if(fc)fc.onsubmit=async e=>{e.preventDefault();const f=new FormData(fc);
    if(await run(sb.from('cars').insert({name:f.get('name').trim(),plate:f.get('plate').trim().toUpperCase(),rate:+f.get('rate')})))fc.reset()};
  const fb=m.querySelector('#fb');
  if(fb){const cs=fb.querySelector('#cs'),rt=fb.querySelector('#rt');
    cs.onchange=()=>rt.value=cs.selectedOptions[0].dataset.r;
    fb.onsubmit=async e=>{e.preventDefault();const f=new FormData(fb);
      if(f.get('end')<f.get('start'))return alert('Return date cannot be before the pickup date.');
      await run(sb.from('bookings').insert({customer_name:f.get('name').trim(),phone:f.get('phone').trim(),id_no:f.get('idno').trim()||null,car_id:f.get('carId'),start_date:f.get('start'),end_date:f.get('end'),rate:+f.get('rate'),paid:+f.get('paid')||0,status:'active'}))}}
  const sq=m.querySelector('#sq');
  if(sq)sq.oninput=()=>{S.q=sq.value;const p=sq.selectionStart;render();const n=$('sq');n.focus();n.setSelectionRange(p,p)};
  m.querySelectorAll('[data-svc]').forEach(b=>b.onclick=()=>{const c=car(b.dataset.svc);run(sb.from('cars').update({service:!c.service}).eq('id',c.id))});
  m.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>confirm('Delete this vehicle permanently?')&&run(sb.from('cars').delete().eq('id',b.dataset.dc)));
  m.querySelectorAll('[data-db]').forEach(b=>b.onclick=()=>confirm('Delete this booking permanently?')&&run(sb.from('bookings').delete().eq('id',b.dataset.db)));
  m.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>run(sb.from('bookings').update({status:'returned',returned_on:td()}).eq('id',b.dataset.ret)));
  m.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const x=S.bookings.find(y=>y.id===b.dataset.pay);const v=prompt('Payment received (₹). Outstanding: '+rs(x.balance),x.balance);if(v&&+v>0)run(sb.from('bookings').update({paid:+x.paid+ +v}).eq('id',x.id))});
  m.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>run(sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role)));
}
sb.auth.getSession().then(({data})=>data.session?boot(data.session):showLogin());
</script>
</body>
</html>
