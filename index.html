<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCR Rentals">
<title>SCR Car Rental | Jaipur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --tx:#0b1220;--mut:#566074;--acc:#0a6cff;--acc2:#5b8cff;--ok:#0f9d6b;--warn:#c27a0a;--bad:#d92d3a;
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--gb:rgba(255,255,255,.75);--gs:rgba(20,40,90,.14);--hl:rgba(255,255,255,.9);
  --in:rgba(255,255,255,.6);--okb:rgba(15,157,107,.14);--warnb:rgba(230,150,20,.16);--badb:rgba(217,45,58,.13);
  --b1:#9cc3ff;--b2:#d7b8ff;--b3:#a5f0d8;--bg:linear-gradient(160deg,#eaf1ff,#f4ecff 55%,#e6fbf3);color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --tx:#eef2fb;--mut:#9aa6bb;--acc:#4f94ff;--acc2:#7aa8ff;--ok:#43d6a1;--warn:#f2b45a;--bad:#ff7b86;
  --glass:rgba(28,34,52,.5);--glass2:rgba(36,44,66,.72);--gb:rgba(255,255,255,.14);--gs:rgba(0,0,0,.45);--hl:rgba(255,255,255,.18);
  --in:rgba(255,255,255,.07);--okb:rgba(67,214,161,.16);--warnb:rgba(242,180,90,.16);--badb:rgba(255,123,134,.16);
  --b1:#1d3fa8;--b2:#5a2aa0;--b3:#0f6b57;--bg:linear-gradient(160deg,#080c18,#0d1226 55%,#08141a);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);background:var(--bg);background-attachment:fixed;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 18s ease-in-out infinite}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--b1);top:-14vmax;left:-12vmax}
.blobs i:nth-child(2){width:40vmax;height:40vmax;background:var(--b2);right:-12vmax;top:18vh;animation-delay:-6s}
.blobs i:nth-child(3){width:38vmax;height:38vmax;background:var(--b3);bottom:-16vmax;left:20vw;animation-delay:-12s}
@keyframes float{50%{transform:translate(4vmax,3vmax) scale(1.08)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(26px) saturate(185%);-webkit-backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--gb);box-shadow:0 10px 34px var(--gs),inset 0 1px 0 var(--hl),inset 0 -1px 0 rgba(255,255,255,.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 38%,transparent 70%,rgba(255,255,255,.12));opacity:.55}
.wrap{max-width:1040px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
header.glass{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:22px;position:sticky;top:max(10px,env(safe-area-inset-top));z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
.logo .mk{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:12px;font-weight:800;box-shadow:0 4px 14px rgba(10,108,255,.4)}
.logo small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.2px;margin-top:-2px}
.nav{display:flex;gap:4px}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;padding:9px 14px;border-radius:14px;cursor:pointer;transition:.25s}
.nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc);background:var(--in);box-shadow:inset 0 1px 0 var(--hl),0 2px 10px var(--gs)}
.nav button:active{transform:scale(.95)}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(135deg,#6a8bff,#b07cff);color:#fff;font-weight:700;cursor:pointer;font-size:14px;transition:.2s}
.avatar:active{transform:scale(.92)}
.dock{display:none}
main{margin-top:18px}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 14px;flex-wrap:wrap}
.title h1{font-size:28px;letter-spacing:-.6px;margin:0;line-height:1.1}
.title p{margin:4px 0 0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat,.card{border-radius:22px;padding:16px 18px}
.stat span{display:block;color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.3px}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:6px}
.card{margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card h4{margin:0;font-size:16px;letter-spacing:-.2px}
.mut{color:var(--mut);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding:12px;border-radius:16px;background:var(--in)}
.money span{display:block;font-size:11px;color:var(--mut);font-weight:600}
.money b{font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:650;cursor:pointer;color:var(--tx);background:var(--in);box-shadow:inset 0 1px 0 var(--hl);transition:transform .15s,box-shadow .25s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 22px rgba(10,108,255,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.danger{background:var(--badb);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:12px}
.btn.full{width:100%;margin-top:6px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;border-radius:99px;padding:8px 15px;font:inherit;font-weight:600;font-size:13px;color:var(--mut);background:var(--in);cursor:pointer;white-space:nowrap;transition:.2s}
.chips button.on{background:var(--acc);color:#fff}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--in);color:var(--tx);font:inherit;font-size:16px;outline:none;transition:.2s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(10,108,255,.18)}
input[readonly]{opacity:.65}
label{display:block;font-size:12px;font-weight:650;color:var(--mut);margin:0 0 6px 2px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .w{grid-column:1/-1}.f>div{min-width:0}
.sum{grid-column:1/-1;padding:12px 14px;border-radius:14px;background:var(--in);font-size:13px;color:var(--mut)}
.sum b{color:var(--tx);font-size:15px}
.search{margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:34px 16px;border-radius:22px;border:1px dashed var(--gb)}
.empty i{display:block;font-style:normal;font-size:34px;margin-bottom:6px}
.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sk{height:84px;border-radius:22px;margin-bottom:12px;background:linear-gradient(100deg,var(--in) 30%,var(--glass2) 50%,var(--in) 70%);background-size:300% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-100% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.enter .card,.enter .stat,.enter .empty,.enter .title{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.backdrop.in{opacity:1}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);background:var(--glass2)}
.backdrop.in .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--mut);opacity:.35;margin:2px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-h h3{margin:0;font-size:20px;letter-spacing:-.3px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--in);color:var(--mut);cursor:pointer;font-size:14px}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:80;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:92vw;transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.toast.in{transform:translate(-50%,0)}
.toast.bad{color:var(--bad)}.toast.ok{color:var(--ok)}
#login{display:none;min-height:100vh;place-items:center;padding:20px}
#login .card{width:100%;max-width:400px;padding:30px 26px;border-radius:30px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
#login .mk{width:56px;height:56px;border-radius:18px;font-size:18px;margin-bottom:16px}
#login h1{margin:0;font-size:26px;letter-spacing:-.6px}
#login .f{grid-template-columns:1fr;margin-top:22px}
#err{color:var(--bad);font-size:13px;min-height:20px;margin:2px 2px 4px}
@media (max-width:760px){
  header .nav{display:none}
  .wrap{padding-left:12px;padding-right:12px}
  .title h1{font-size:25px}
  .dock{display:flex;position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(92vw,420px);padding:7px;border-radius:30px;justify-content:space-around;gap:2px}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:11px;font-weight:650;padding:8px 4px;border-radius:23px;cursor:pointer;transition:.25s}
  .dock button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dock button.on{color:var(--acc);background:var(--in);box-shadow:inset 0 1px 0 var(--hl)}
  .dock button:active{transform:scale(.92)}
  .fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;border-radius:99px;padding:14px 22px;box-shadow:0 12px 30px rgba(10,108,255,.45)}
  .f{grid-template-columns:1fr}
  .logo small{display:none}
}
@media (prefers-reduced-motion:reduce){*,.blobs i{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="toast glass" id="toast"></div>

<div id="login">
  <div class="card glass">
    <div class="logo"><div class="mk">SCR</div></div>
    <h1>SCR Car Rental</h1><div class="mut">Jaipur · Fleet management portal</div>
    <form id="lf" class="f">
      <div><label>Email address</label><input type="email" name="email" required autocomplete="username" placeholder="name@company.com"></div>
      <div><label>Password</label><input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></div>
      <div id="err"></div>
      <button class="btn primary full" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <header class="glass">
    <div class="logo"><div class="mk">SCR</div><div>SCR Car Rental<small>Jaipur</small></div></div>
    <div class="nav" id="nav"></div>
    <button class="avatar" id="me" aria-label="Account"></button>
  </header>
  <main id="main"></main>
</div>
<nav class="dock glass" id="dock"></nav>

<script>
const SUPABASE_URL='https://gufjtgrkyubdgfcxwpky.supabase.co';
const SUPABASE_KEY='sb_publishable_u6O4oPo4Io5j9LHj7VBhmg_4BBhqS5c';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const S={cars:[],bookings:[],team:[],role:null,email:'',tab:'dash',q:'',flt:'all',loading:true};
const adm=()=>S.role==='owner'||S.role==='admin';
const $=id=>document.getElementById(id);
const rs=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const td=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const car=id=>S.cars.find(c=>c.id===id);
const busy=id=>S.bookings.find(b=>b.car_id===id&&b.status==='active'&&b.start_date<=td()&&b.end_date>=td());
const IC={
 dash:'<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-5h4v5"/></svg>',
 bookings:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
 cars:'<svg viewBox="0 0 24 24"><path d="M4 16v-4.5L6.2 6h11.6L20 11.5V16M3 16h18M7 16v3M17 16v3"/><circle cx="8" cy="13" r=".7"/><circle cx="16" cy="13" r=".7"/></svg>',
 team:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.5-6 6.5-6s5.7 2 6.5 6M16 5a3.5 3.5 0 010 7M18 14c2 .6 3.3 2.6 3.5 6"/></svg>'};
const TABS=[['dash','Overview',1],['bookings','Bookings',0],['cars','Fleet',1],['team','Team',2]];

let tt;function toast(m,t='ok'){const e=$('toast');e.textContent=m;e.className='toast glass in '+t;clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('in'),2800)}
function fail(e){toast(e.code==='23P01'?'This vehicle is already booked for the selected dates.':e.code==='42501'?'You do not have permission to perform this action.':e.code==='23503'?'This record is linked to other data and cannot be deleted.':e.code==='23505'?'A record with these details already exists.':e.message,'bad')}
async function run(p,msg){const r=await p;if(r.error){fail(r.error);return false}await load();if(msg)toast(msg);return true}

function sheet(title,body,onSubmit){
  const bd=document.createElement('div');bd.className='backdrop';
  bd.innerHTML=`<div class="sheet glass"><div class="grab"></div><div class="sh-h"><h3>${title}</h3><button class="x" type="button" aria-label="Close">✕</button></div><form class="f">${body}</form></div>`;
  document.body.appendChild(bd);requestAnimationFrame(()=>bd.classList.add('in'));
  const close=()=>{bd.classList.remove('in');setTimeout(()=>bd.remove(),300)};
  bd.onclick=e=>{if(e.target===bd)close()};bd.querySelector('.x').onclick=close;
  const f=bd.querySelector('form');
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');if(b)b.disabled=true;const ok=await onSubmit(new FormData(f),f);if(b)b.disabled=false;if(ok!==false)close()};
  return {f,close};
}
function confirmBox(text,label,fn){sheet('Please confirm',`<div class="w mut">${text}</div><div class="w"><button class="btn danger full" type="submit">${label}</button></div>`,async()=>{await fn()})}

async function load(){
  const [c,b]=await Promise.all([sb.from('cars').select('*').order('name'),sb.from('bookings').select('*').order('start_date',{ascending:false})]);
  S.cars=c.data||[];S.bookings=b.data||[];
  if(S.role==='owner'){const t=await sb.from('profiles').select('*').order('created_at');S.team=t.data||[]}
  const first=S.loading;S.loading=false;render(first);
}
async function boot(session){
  $('login').style.display='none';
  const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(!p){await sb.auth.signOut();showLogin(pe?'Database error: '+pe.message:'Your account has not been activated yet. Please contact the administrator.');return}
  S.role=p.role;S.email=session.user.email;
  $('app').style.display='block';$('me').textContent=S.email[0].toUpperCase();
  render(true);await load();
  sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe();
}
function showLogin(msg){$('app').style.display='none';$('dock').style.display='none';$('login').style.display='grid';$('err').textContent=msg||''}
$('lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector('button');b.disabled=true;b.textContent='Signing in…';$('err').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  b.disabled=false;b.textContent='Sign in';if(error)$('err').textContent=error.message.includes('Invalid')?'Incorrect email or password.':error.message;else boot(data.session)};
$('me').onclick=()=>sheet('Account',`<div class="w"><b>${esc(S.email)}</b><div class="mut" style="text-transform:capitalize">${S.role}</div></div><div class="w"><button class="btn danger full" type="submit">Sign out</button></div>`,async()=>{await sb.auth.signOut();location.reload()});

function render(animate){
  const tabs=TABS.filter(t=>t[2]===0||(t[2]===1&&adm())||(t[2]===2&&S.role==='owner'));
  if(!tabs.find(t=>t[0]===S.tab))S.tab='bookings';
  const nv=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-t="${k}">${IC[k]}<span>${l}</span></button>`).join('');
  $('nav').innerHTML=nv;$('dock').innerHTML=nv;$('dock').style.display='';
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render(true);scrollTo({top:0,behavior:'smooth'})});
  const m=$('main');
  m.innerHTML=S.loading?'<div class="sk"></div><div class="sk"></div><div class="sk"></div>':S.tab==='dash'?dash():S.tab==='cars'?cars():S.tab==='team'?team():bookings();
  m.classList.toggle('enter',!!animate);
  if(animate)m.querySelectorAll('.card,.stat,.empty,.title').forEach((el,i)=>el.style.animationDelay=Math.min(i,12)*45+'ms');
  wire(m);
}
const hello=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};

function dash(){
  const act=S.bookings.filter(b=>b.status==='active');
  const onRent=S.cars.filter(c=>busy(c.id)).length;
  const avail=S.cars.filter(c=>!c.service&&!busy(c.id)).length;
  const coll=S.bookings.reduce((s,b)=>s+ +b.paid,0);
  const pend=S.bookings.reduce((s,b)=>s+Math.max(0,+b.balance),0);
  const late=act.filter(b=>b.end_date<td());
  const soon=act.filter(b=>b.end_date>=td()).sort((a,b)=>a.end_date.localeCompare(b.end_date)).slice(0,5);
  const util=S.cars.length?Math.round(onRent/S.cars.length*100):0;
  const li=(b,cls,t)=>`<div class="card glass row"><div><h4>${esc(b.customer_name)}</h4><div class="mut">${esc(car(b.car_id)?.name||'—')} · Due ${fd(b.end_date)}</div><div class="mut">${esc(b.phone)}</div></div><span class="chip ${cls}">${t}</span></div>`;
  return `<div class="title"><div><h1>${hello()}</h1><p>Here is how your fleet is performing today.</p></div></div>
  <div class="grid">
  <div class="stat glass"><span>Fleet size</span><b>${S.cars.length}</b></div>
  <div class="stat glass"><span>Currently on rent</span><b>${onRent}</b></div>
  <div class="stat glass"><span>Available now</span><b>${avail}</b></div>
  <div class="stat glass"><span>Revenue collected</span><b>${rs(coll)}</b></div>
  <div class="stat glass"><span>Outstanding balance</span><b style="color:var(--warn)">${rs(pend)}</b></div></div>
  <div class="card glass"><div class="row"><h4>Fleet utilisation</h4><b>${util}%</b></div><div class="bar"><i style="width:${util}%"></i></div></div>
  <div class="title"><div><h4 style="margin:10px 0 0;font-size:18px">Overdue returns · ${late.length}</h4></div></div>
  ${late.map(b=>li(b,'bad','Overdue')).join('')||'<div class="empty glass"><i>✅</i>All vehicles are on schedule.</div>'}
  <div class="title"><div><h4 style="margin:10px 0 0;font-size:18px">Upcoming returns</h4></div></div>
  ${soon.map(b=>li(b,'ok','Active')).join('')||'<div class="empty glass"><i>🗓️</i>No active rentals at the moment.</div>'}`;
}
function cars(){
  return `<div class="title"><div><h1>Fleet</h1><p>${S.cars.length} vehicle${S.cars.length===1?'':'s'} registered</p></div><button class="btn primary fab" id="addCar">＋ Add vehicle</button></div>`+
  (S.cars.map(c=>{const b=busy(c.id);const t=c.service?['warn','In service']:b?['bad','On rent']:['ok','Available'];
  return `<div class="card glass"><div class="row"><div><h4>${esc(c.name)}</h4><div class="mut">${esc(c.plate)} · ${rs(c.rate)} per day</div>${b?`<div class="mut">Rented to ${esc(b.customer_name)} until ${fd(b.end_date)}</div>`:''}</div><span class="chip ${t[0]}">${t[1]}</span></div>
  <div class="acts"><button class="btn sm" data-svc="${c.id}">${c.service?'Return to service':'Send for maintenance'}</button><button class="btn sm" data-edit="${c.id}">Edit rate</button><button class="btn sm danger" data-dc="${c.id}">Remove</button></div></div>`}).join('')||'<div class="empty glass"><i>🚗</i>Your fleet is empty. Add your first vehicle to get started.</div>');
}
function bookings(){
  const q=S.q.toLowerCase();
  const st=b=>b.status==='returned'?'returned':b.end_date<td()?'overdue':'active';
  const cnt=f=>S.bookings.filter(b=>f==='all'||st(b)===f).length;
  const list=S.bookings.filter(b=>(S.flt==='all'||st(b)===S.flt)&&(!q||(b.customer_name+b.phone+(car(b.car_id)?.name||'')).toLowerCase().includes(q)))
    .sort((a,b)=>a.status===b.status?b.start_date.localeCompare(a.start_date):a.status==='active'?-1:1);
  return `<div class="title"><div><h1>Bookings</h1><p>Manage rentals, payments and returns.</p></div><button class="btn primary fab" id="addB">＋ New booking</button></div>
  <input class="search" id="sq" type="search" placeholder="Search by customer, phone or vehicle" value="${esc(S.q)}">
  <div class="chips">${[['all','All'],['active','Active'],['overdue','Overdue'],['returned','Completed']].map(([k,l])=>`<button class="${S.flt===k?'on':''}" data-f="${k}">${l} · ${cnt(k)}</button>`).join('')}</div>`+
  (list.map(b=>{const bl=+b.balance,s=st(b);
  return `<div class="card glass"><div class="row"><div><h4>${esc(b.customer_name)}</h4><div class="mut">${esc(car(b.car_id)?.name||'—')} · ${esc(b.phone)}</div>
  <div class="mut">${fd(b.start_date)} → ${fd(b.end_date)} · ${b.days} day${b.days>1?'s':''} × ${rs(b.rate)}${b.id_no?' · ID '+esc(b.id_no):''}</div></div>
  <span class="chip ${s==='returned'?'ok':s==='overdue'?'bad':'warn'}">${s==='returned'?'Completed':s==='overdue'?'Overdue':'Active'}</span></div>
  <div class="money"><div><span>Total</span><b>${rs(b.total)}</b></div><div><span>Paid</span><b>${rs(b.paid)}</b></div><div><span>Balance</span><b style="color:${bl>0?'var(--bad)':'var(--ok)'}">${rs(bl)}</b></div></div>
  ${adm()?`<div class="acts">${bl>0?`<button class="btn sm" data-pay="${b.id}">Record payment</button>`:''}${b.status==='active'?`<button class="btn sm primary" data-ret="${b.id}">Complete return</button>`:''}<button class="btn sm danger" data-db="${b.id}">Delete</button></div>`:''}</div>`}).join('')||'<div class="empty glass"><i>📋</i>No bookings match your filters.</div>');
}
function team(){
  return `<div class="title"><div><h1>Team</h1><p>Create logins in your Supabase dashboard, then assign roles here.</p></div></div>`+
  S.team.map(p=>`<div class="card glass row" style="align-items:center"><div><h4>${esc(p.full_name||p.email)}</h4><div class="mut">${esc(p.email)}</div></div>
  <select data-role="${p.id}" style="width:auto;min-width:130px">${[['owner','Owner'],['admin','Admin'],['staff','Staff']].map(([v,l])=>`<option value="${v}" ${p.role===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('');
}

function newCar(){sheet('Add vehicle',`<div class="w"><label>Vehicle name</label><input name="name" placeholder="e.g. Maruti Dzire" required></div>
  <div><label>Registration number</label><input name="plate" placeholder="RJ14 AB 1234" required></div><div><label>Daily rate (₹)</label><input name="rate" type="number" inputmode="numeric" min="0" required></div>
  <div class="w"><button class="btn primary full" type="submit">Add vehicle</button></div>`,
  async f=>run(sb.from('cars').insert({name:f.get('name').trim(),plate:f.get('plate').trim().toUpperCase(),rate:+f.get('rate')}),'Vehicle added'))}
function editCar(c){sheet('Edit daily rate',`<div class="w mut">${esc(c.name)} · ${esc(c.plate)}</div><div class="w"><label>Daily rate (₹)</label><input name="rate" type="number" inputmode="numeric" min="0" value="${c.rate}" required></div>
  <div class="w"><button class="btn primary full" type="submit">Save changes</button></div>`,async f=>run(sb.from('cars').update({rate:+f.get('rate')}).eq('id',c.id),'Rate updated'))}
function newBooking(){
  const free=S.cars.filter(c=>!c.service);
  if(!free.length)return toast('Please add an available vehicle first.','bad');
  const s=sheet('New booking',`<div class="w"><label>Customer name</label><input name="name" autocomplete="off" required></div>
  <div><label>Phone number</label><input name="phone" type="tel" inputmode="tel" required></div><div><label>ID / licence number</label><input name="idno"></div>
  <div class="w"><label>Vehicle</label><select name="carId">${free.map(c=>`<option value="${c.id}" data-r="${c.rate}">${esc(c.name)} · ${esc(c.plate)}${busy(c.id)?' (on rent)':''}</option>`).join('')}</select></div>
  <div><label>Pickup date</label><input name="start" type="date" value="${td()}" required></div><div><label>Return date</label><input name="end" type="date" value="${td()}" required></div>
  <div><label>Daily rate (₹)${adm()?'':' · set by management'}</label><input name="rate" type="number" inputmode="numeric" value="${free[0].rate}" required ${adm()?'':'readonly'}></div>
  <div><label>Advance paid (₹)</label><input name="paid" type="number" inputmode="numeric" min="0" value="0"></div>
  <div class="sum" id="sum"></div><div class="w"><button class="btn primary full" type="submit">Confirm booking</button></div>`,
  async f=>{if(f.get('end')<f.get('start')){toast('Return date cannot be before the pickup date.','bad');return false}
    return run(sb.from('bookings').insert({customer_name:f.get('name').trim(),phone:f.get('phone').trim(),id_no:f.get('idno').trim()||null,car_id:f.get('carId'),start_date:f.get('start'),end_date:f.get('end'),rate:+f.get('rate'),paid:+f.get('paid')||0,status:'active'}),'Booking confirmed')});
  const F=s.f.elements,upd=()=>{const d=Math.max(1,Math.round((new Date(F.end.value)-new Date(F.start.value))/864e5)+1),t=d*(+F.rate.value||0);
    s.f.querySelector('#sum').innerHTML=`${d} day${d>1?'s':''} · Total <b>${rs(t)}</b> · Balance due <b>${rs(t-(+F.paid.value||0))}</b>`};
  F.carId.onchange=()=>{F.rate.value=F.carId.selectedOptions[0].dataset.r;upd()};s.f.oninput=upd;upd();
}
function pay(b){sheet('Record payment',`<div class="w mut">${esc(b.customer_name)} · Outstanding <b style="color:var(--tx)">${rs(b.balance)}</b></div>
  <div class="w"><label>Amount received (₹)</label><input name="amt" type="number" inputmode="numeric" min="1" value="${Math.max(0,+b.balance)}" required></div>
  <div class="w"><button class="btn primary full" type="submit">Save payment</button></div>`,async f=>run(sb.from('bookings').update({paid:+b.paid+ +f.get('amt')}).eq('id',b.id),'Payment recorded'))}

function wire(m){
  const on=(sel,fn)=>m.querySelectorAll(sel).forEach(fn);
  const a=m.querySelector('#addCar');if(a)a.onclick=newCar;
  const n=m.querySelector('#addB');if(n)n.onclick=newBooking;
  const sq=m.querySelector('#sq');
  if(sq)sq.oninput=()=>{S.q=sq.value;const p=sq.selectionStart;render();const e=$('sq');e.focus();e.setSelectionRange(p,p)};
  on('[data-f]',b=>b.onclick=()=>{S.flt=b.dataset.f;render()});
  on('[data-svc]',b=>b.onclick=()=>{const c=car(b.dataset.svc);run(sb.from('cars').update({service:!c.service}).eq('id',c.id),c.service?'Vehicle is back in service':'Vehicle sent for maintenance')});
  on('[data-edit]',b=>b.onclick=()=>editCar(car(b.dataset.edit)));
  on('[data-dc]',b=>b.onclick=()=>confirmBox('This will permanently remove the vehicle from your fleet.','Remove vehicle',()=>run(sb.from('cars').delete().eq('id',b.dataset.dc),'Vehicle removed')));
  on('[data-db]',b=>b.onclick=()=>confirmBox('This will permanently delete the booking and its payment record.','Delete booking',()=>run(sb.from('bookings').delete().eq('id',b.dataset.db),'Booking deleted')));
  on('[data-ret]',b=>b.onclick=()=>run(sb.from('bookings').update({status:'returned',returned_on:td()}).eq('id',b.dataset.ret),'Return completed'));
  on('[data-pay]',b=>b.onclick=()=>pay(S.bookings.find(y=>y.id===b.dataset.pay)));
  on('[data-role]',s=>s.onchange=()=>run(sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role),'Role updated'));
}
sb.auth.getSession().then(({data})=>data.session?boot(data.session):showLogin());
</script>
</body>
</html>
